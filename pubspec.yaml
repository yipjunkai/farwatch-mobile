name: farwatch_app
description: "Farwatch mobile client"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Terminal emulator
  xterm: ^4.0.0

  # Cryptography (X25519, AES-GCM, HKDF, HMAC-SHA256)
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

  # MessagePack (wire format compatible with Rust rmp-serde)
  msgpack_dart: ^1.0.1

  # WebSocket
  web_socket_channel: ^3.0.2

  # QR code scanning
  mobile_scanner: ^7.0.0

  # Speech-to-text (on-device recognition)
  speech_to_text: ^7.0.0

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.0

  # Time formatting
  timeago: ^3.7.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
