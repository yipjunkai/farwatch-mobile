name: farwatch_app
description: "Farwatch mobile client"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Terminal emulator
  xterm: ^4.0.0

  # Cryptography (X25519, AES-GCM, HKDF, HMAC-SHA256)
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

  # MessagePack (wire format compatible with Rust rmp-serde)
  msgpack_dart: ^1.0.1

  # WebSocket
  web_socket_channel: ^3.0.2

  # QR code scanning
  mobile_scanner: ^7.0.0

  # Speech-to-text (on-device recognition)
  speech_to_text: ^7.0.0

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage
  shared_preferences: ^2.3.0

  # App version info
  package_info_plus: ^8.0.0

  # Time formatting
  timeago: ^3.7.0

  # Markdown rendering
  flutter_markdown: ^0.7.6
  
  # Deep links
  app_links: ^6.4.0

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: true
  # Place your 1024×1024 icon at this path before running:
  #   dart run flutter_launcher_icons
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  # Place your icon at assets/icon/icon.png before running:
  #   dart run flutter_native_splash:create
  color: "#000000"
  image: "assets/icon/icon.png"
  color_dark: "#000000"
  image_dark: "assets/icon/icon.png"
  android_12:
    color: "#000000"
    image: "assets/icon/icon.png"
    color_dark: "#000000"
    image_dark: "assets/icon/icon.png"
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
