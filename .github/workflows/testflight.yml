name: Deploy to TestFlight

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ios-deploy
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.41.5'

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [test, analyze, format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run tests
        if: matrix.check == 'test'
        run: flutter test

      - name: Run analysis
        if: matrix.check == 'analyze'
        run: flutter analyze

      - name: Check formatting
        if: matrix.check == 'format'
        run: dart format --set-exit-if-changed .

  build-and-deploy:
    name: Build & Upload to TestFlight
    needs: checks
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$MATCH_DEPLOY_KEY" ] && missing="$missing MATCH_DEPLOY_KEY"
          [ -z "$MATCH_GIT_URL" ] && missing="$missing MATCH_GIT_URL"
          [ -z "$MATCH_PASSWORD" ] && missing="$missing MATCH_PASSWORD"
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_KEY_CONTENT" ] && missing="$missing ASC_KEY_CONTENT"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Ruby (for Fastlane)
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Cache pub and CocoaPods dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.pub-cache
            ios/Pods
          key: ${{ runner.os }}-deps-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Determine build number
        id: build_number
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "BUILD_NUMBER=$RUN_NUMBER" >> $GITHUB_OUTPUT

      - name: Determine version from tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            # Strip 'v' prefix from tag: v0.1.0 -> 0.1.0
            TAG_VERSION="${REF_NAME#v}"

            # Validate tag version matches pubspec.yaml
            PUBSPEC_VERSION=$(awk '/^version:/{gsub(/version:[[:space:]]*/, ""); gsub(/\+.*/, ""); print}' pubspec.yaml)
            if [[ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]]; then
              echo "::error::Tag version ($TAG_VERSION) does not match pubspec.yaml version ($PUBSPEC_VERSION)"
              exit 1
            fi

            echo "VERSION=$TAG_VERSION" >> $GITHUB_OUTPUT
          else
            # Use version from pubspec.yaml
            VERSION=$(awk '/^version:/{gsub(/version:[[:space:]]*/, ""); gsub(/\+.*/, ""); print}' pubspec.yaml)
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Validate version and build number
        env:
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.BUILD_NUMBER }}
        run: |
          if [ -z "$BUILD_VERSION" ]; then
            echo "::error::VERSION output is empty"
            exit 1
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            echo "::error::BUILD_NUMBER output is empty"
            exit 1
          fi
          echo "Building version $BUILD_VERSION+$BUILD_NUMBER"

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: ios

      - name: Set up Fastlane Match SSH key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Set up keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}

      - name: Sync code signing with Match
        run: bundle exec fastlane sync_certs
        working-directory: ios
        env:
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ github.run_id }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}

      - name: Build Flutter IPA
        env:
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.BUILD_NUMBER }}
        run: |
          flutter build ipa \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --build-name="$BUILD_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        run: bundle exec fastlane beta
        working-directory: ios
        env:
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ github.run_id }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: farwatch-${{ steps.version.outputs.VERSION }}-${{ steps.build_number.outputs.BUILD_NUMBER }}.ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: farwatch-${{ steps.version.outputs.VERSION }}-${{ steps.build_number.outputs.BUILD_NUMBER }}-symbols
          path: build/symbols/
          retention-days: 90

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain || true
